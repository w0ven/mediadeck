# Include inside the ordinary media server BEFORE playback-admission.conf.
# Define deck_playback_gateway (127.0.0.1:8339) in http {}.
# RELEASE ORDER: deploy the matching Deck + gateway code BEFORE this location.
# Forward: Deck's stream handler is the sole admission owner. CMCC/local:
# gateway calls Deck admission before it issues/relays. Do NOT add an outer
# auth_request here; do NOT use this for an unguarded gateway/Emby upstream.
# Existing installations should keep their routing headers/logging and remove
# ONLY the stream/original auth_request after deploying both code components.
location ~ ^/(emby/)?[Vv]ideos/[^/]+/(?i:stream|original)(\.[A-Za-z0-9]+)?$ {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    proxy_pass http://deck_playback_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Mediadeck-Entry $http_x_mediadeck_entry;
    proxy_set_header X-Mediadeck-Entry-Key $http_x_mediadeck_entry_key;
    proxy_set_header X-Mediadeck-Proxy nginx;
    proxy_set_header X-Mediadeck-Origin-Fallback off;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_read_timeout 90s;
    add_header Cache-Control "private, no-store" always;
}
