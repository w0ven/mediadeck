# EXAMPLE: add maps in the HTTP context of a signed media node.
# Keep existing log formats, deny maps and limit_conn_zone unchanged.
# Signed r=0 and absent r both fall back to decimal 15 MB/s.
map $arg_r $mediadeck_rate {
    ""      15000000;
    "0"     15000000;
    default $arg_r;
}
map $arg_u $mediadeck_user_key {
    ""      $remote_addr;
    default $arg_u;
}
