# Include inside the media server {} AFTER its existing stream/original
# location (which must ALSO contain: auth_request /_deck_admission;).
# Define upstreams deck_admission_backend and emby_playback_origin in http {}.
# Do NOT cache this subrequest or fall back to origin on admission failure.
location = /_deck_admission {
    internal;
    proxy_pass http://deck_admission_backend/api/playback/admit;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Proxy only PlaybackInfo metadata through Deck so the generated PlaySessionId
# is bound atomically before URLs leave the entrance. No video bytes use Deck.
location ~* ^/(emby/)?Items/([^/]+)/PlaybackInfo$ {
    rewrite (?i)^/(?:emby/)?Items/([^/]+)/PlaybackInfo$ /api/playback/info/$1 break;
    proxy_pass http://deck_admission_backend;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_read_timeout 90s;
}

# The earlier stream/original regex keeps its existing gateway/302 routing.
# Match stream issuers/HLS only. Subtitles, images, metadata and downloads
# retain their existing origin path and do not acquire playback seats.
location ~* ^/(emby/)?(Videos|Audio)/[^/]+/(stream|original|master|main|manifest|live|hls[0-9]*|universal)([./].*)?$ {
    auth_request /_deck_admission;
    proxy_pass http://emby_playback_origin;
    proxy_set_header X-Mediadeck-Entry "";
    proxy_set_header X-Mediadeck-Entry-Key "";
    proxy_set_header X-Mediadeck-Proxy "";
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_read_timeout 3600s;
    add_header Cache-Control "private, no-store" always;
}

# Client lifecycle metadata only (never video proxying). Preserve caller
# headers/query/body. Observe the bound play only AFTER Emby accepts it.
location ~* ^/(emby/)?Sessions/Playing$ {
    rewrite ^ /api/playback/started break;
    proxy_pass http://deck_admission_backend;
    proxy_cache off;
    proxy_intercept_errors off;
}
location ~* ^/(emby/)?Sessions/Playing/Progress$ {
    rewrite ^ /api/playback/progress break;
    proxy_pass http://deck_admission_backend;
    proxy_cache off;
    proxy_intercept_errors off;
}

# Release the matching pending lease only AFTER Emby accepts Stopped.
location ~* ^/(emby/)?Sessions/Playing/Stopped$ {
    rewrite ^ /api/playback/stopped break;
    proxy_pass http://deck_admission_backend;
    proxy_cache off;
    proxy_intercept_errors off;
}
