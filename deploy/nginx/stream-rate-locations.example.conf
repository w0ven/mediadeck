# EXAMPLE ONLY. Fill placeholders from deployment-private configuration and
# merge into existing signed media locations; do not replace an existing site.
# Repeat this pattern for each reader, with the same relay host/port and a
# distinct internal index. Keep original HEAD/GET, Range, auth, billing,
# session-count, timeout, node-header and traffic-log directives unchanged.
# Internal auth/metering endpoints must remain defined by the existing site.

location ^~ /__POOL_A_PREFIX__/ {
    # Keep the original metadata capture and any existing deny-map guard.
    if ($md_denied) { return 403; }
    auth_request /__VERIFY_ENDPOINT__;
    limit_conn mediadeck_peruser 4;
    mirror /__ANNOUNCE_ENDPOINT__;
    include __METERING_LOCATION_INCLUDE__;
    access_log __SPEED_LOG_PATH__ mediadeck_speed;
    access_log __DISPATCH_LOG_PATH__ __DISPATCH_LOG_FORMAT__;
    # nginx limit_rate is PER REQUEST and must not coexist here.
    proxy_pass http://__LOOPBACK_HOST__:__RELAY_PORT__/0/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Mediadeck-Rate-Key $mediadeck_user_key;
    proxy_set_header X-Mediadeck-Rate $mediadeck_rate;
    proxy_buffering off;
    proxy_force_ranges on;
}

location ^~ /__POOL_B_PREFIX__/ {
    if ($md_denied) { return 403; }
    auth_request /__VERIFY_ENDPOINT__;
    limit_conn mediadeck_peruser 4;
    mirror /__ANNOUNCE_ENDPOINT__;
    include __METERING_LOCATION_INCLUDE__;
    access_log __SPEED_LOG_PATH__ mediadeck_speed;
    access_log __DISPATCH_LOG_PATH__ __DISPATCH_LOG_FORMAT__;
    proxy_pass http://__LOOPBACK_HOST__:__RELAY_PORT__/1/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Mediadeck-Rate-Key $mediadeck_user_key;
    proxy_set_header X-Mediadeck-Rate $mediadeck_rate;
    proxy_buffering off;
    proxy_force_ranges on;
}
