name: CI

on:
  push:
    branches: [main, feature/economy-release-20261007]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  MEDIADECK_MOCK: "1"

jobs:
  quick:
    name: Lint, gateway and mock startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests tools/ci_shards.py
      - name: Verify 100% test shard coverage
        run: python tools/ci_shards.py --group verify
      - name: Test gateway local playback and registry cache
        run: |
          python3 ../deploy/gateway/test_duanju_local.py
          python3 ../deploy/gateway/test_registry_cache.py
      - name: Mock startup and health
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request

          with tempfile.TemporaryDirectory() as data:
              env = dict(os.environ, MEDIADECK_MOCK="1", MEDIADECK_DATA_DIR=data)
              server = subprocess.Popen([
                  sys.executable, "-m", "uvicorn", "app.main:app",
                  "--host", "127.0.0.1", "--port", "18300",
              ], env=env)
              try:
                  for _ in range(100):
                      if server.poll() is not None:
                          raise RuntimeError("Mock server exited before becoming healthy")
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:18300/healthz", timeout=1) as response:
                              assert json.load(response) == {"status": "ok"}
                          print("Mock startup health verified")
                          break
                      except OSError:
                          time.sleep(0.1)
                  else:
                      raise RuntimeError("Mock startup health timed out")
              finally:
                  server.terminate()
                  try:
                      server.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait()
                      raise RuntimeError("Mock shutdown did not finish")
          PY

  unit:
    name: Backend unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit test shard ${{ matrix.shard }}/4
        run: |
          mapfile -t FILES < <(python tools/ci_shards.py --group unit --shards 4 --index ${{ matrix.shard }})
          echo "Running ${#FILES[@]} unit test files"
          python -m pytest "${FILES[@]}" -q

  proxy:
    name: Proxy, nginx and netns tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Configure resilient apt timeouts
        run: |
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-mediadeck-ci-timeouts >/dev/null
      - name: Install loopback proxy test runtimes
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends caddy nginx
          caddy version
          nginx -v
      - name: Run proxy and network-namespace tests
        run: |
          mapfile -t FILES < <(python tools/ci_shards.py --group proxy --shards 1 --index 1)
          echo "Running ${#FILES[@]} proxy/netns test files"
          sudo env "PATH=$PATH" "TZ=$TZ" "MEDIADECK_MOCK=$MEDIADECK_MOCK" "$(command -v python)" -m pytest "${FILES[@]}" -q

  browser:
    name: Browser UI tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Set isolated browser cache path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/mediadeck-browsers" >> "$GITHUB_ENV"
      - name: Configure resilient apt timeouts for browser dependencies
        run: |
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-mediadeck-ci-timeouts >/dev/null
      - name: Install isolated browser test runtime
        timeout-minutes: 5
        run: python -m playwright install --with-deps chromium
      - name: Select actual headless shell for offline CLI browser tests
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "mediadeck-test-bin"
          directory.mkdir()
          cache = Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"])
          shells = list(cache.glob("chromium_headless_shell-*/*/headless_shell"))
          shells += list(cache.glob("chromium_headless_shell-*/*/chrome-headless-shell"))
          assert len(shells) == 1, "Expected the Playwright-installed headless shell"
          executable = str(shells[0])
          probe = subprocess.run([
              executable, "--no-sandbox", "--disable-gpu", "--dump-dom",
              "--virtual-time-budget=1000", "data:text/html,<body>offline-browser-ok</body>",
          ], capture_output=True, text=True, timeout=15, check=True)
          assert "offline-browser-ok" in probe.stdout
          (directory / "chromium").symlink_to(executable)
          with open(os.environ["GITHUB_PATH"], "a") as path:
              path.write(str(directory) + "\n")
          PY
      - name: Run browser UI test shard ${{ matrix.shard }}/2
        run: |
          mapfile -t FILES < <(python tools/ci_shards.py --group browser --shards 2 --index ${{ matrix.shard }})
          echo "Running ${#FILES[@]} browser test files"
          python -m pytest "${FILES[@]}" -q
