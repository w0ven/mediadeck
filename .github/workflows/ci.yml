name: CI

on:
  push:
    branches: [main, feature/economy-release-20261007]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, tests and mock startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      MEDIADECK_MOCK: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Set isolated browser cache path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/mediadeck-browsers" >> "$GITHUB_ENV"
      - name: Use official HTTPS mirrors for isolated browser dependencies
        run: |
          # The hosted runner's HTTP Azure mirror can stall apt for the whole
          # job. Change only this disposable CI runner, not deployed hosts.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-mediadeck-ci-timeouts >/dev/null
      - name: Install isolated browser test runtime
        timeout-minutes: 5
        run: python -m playwright install --with-deps chromium
      - name: Select actual headless shell for offline CLI browser tests
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "mediadeck-test-bin"
          directory.mkdir()
          cache = Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"])
          shells = list(cache.glob("chromium_headless_shell-*/*/headless_shell"))
          shells += list(cache.glob("chromium_headless_shell-*/*/chrome-headless-shell"))
          assert len(shells) == 1, "Expected the Playwright-installed headless shell"
          executable = str(shells[0])
          probe = subprocess.run([
              executable, "--no-sandbox", "--disable-gpu", "--dump-dom",
              "--virtual-time-budget=1000", "data:text/html,<body>offline-browser-ok</body>",
          ], capture_output=True, text=True, timeout=15, check=True)
          assert "offline-browser-ok" in probe.stdout
          (directory / "chromium").symlink_to(executable)
          with open(os.environ["GITHUB_PATH"], "a") as path:
              path.write(str(directory) + "\n")
          PY
      - name: Lint
        run: ruff check app tests
      - name: Test including isolated nginx and network-namespace fixtures
        run: sudo env "PATH=$PATH" "TZ=$TZ" "MEDIADECK_MOCK=$MEDIADECK_MOCK" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" "$(command -v python)" -m pytest tests -q
      - name: Mock startup and health
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request

          with tempfile.TemporaryDirectory() as data:
              env = dict(os.environ, MEDIADECK_MOCK="1", MEDIADECK_DATA_DIR=data)
              server = subprocess.Popen([
                  sys.executable, "-m", "uvicorn", "app.main:app",
                  "--host", "127.0.0.1", "--port", "18300",
              ], env=env)
              try:
                  for _ in range(100):
                      if server.poll() is not None:
                          raise RuntimeError("Mock server exited before becoming healthy")
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:18300/healthz", timeout=1) as response:
                              assert json.load(response) == {"status": "ok"}
                          print("Mock startup health verified")
                          break
                      except OSError:
                          time.sleep(0.1)
                  else:
                      raise RuntimeError("Mock startup health timed out")
              finally:
                  server.terminate()
                  try:
                      server.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait()
                      raise RuntimeError("Mock shutdown did not finish")
          PY
