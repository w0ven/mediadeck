name: CI

on:
  push:
    branches: [main, feature/economy-release-20261007]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, tests and mock startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      MEDIADECK_MOCK: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install isolated browser test runtime
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: python -m pytest tests -q
      - name: Mock startup and health
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.request

          with tempfile.TemporaryDirectory() as data:
              env = dict(os.environ, MEDIADECK_MOCK="1", MEDIADECK_DATA_DIR=data)
              server = subprocess.Popen([
                  sys.executable, "-m", "uvicorn", "app.main:app",
                  "--host", "127.0.0.1", "--port", "18300",
              ], env=env)
              try:
                  for _ in range(100):
                      if server.poll() is not None:
                          raise RuntimeError("Mock server exited before becoming healthy")
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:18300/healthz", timeout=1) as response:
                              assert json.load(response) == {"status": "ok"}
                          print("Mock startup health verified")
                          break
                      except OSError:
                          time.sleep(0.1)
                  else:
                      raise RuntimeError("Mock startup health timed out")
              finally:
                  server.terminate()
                  try:
                      server.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      server.kill()
                      server.wait()
                      raise RuntimeError("Mock shutdown did not finish")
          PY
