[project]
name = "mediadeck"
version = "0.1.0"
description = "Unified control panel for an Emby-based media stack"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "playwright>=1.49"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
