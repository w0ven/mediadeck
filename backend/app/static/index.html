<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mediadeck</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div class="brand"><span class="brand-name">mediadeck</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="avatar" id="who-initial">K</div>
      <div class="who" id="who">—</div>
    </div>
  </aside>

  <div id="content">
    <header id="topbar">
      <div>
        <h1 id="page-title">仪表盘</h1>
        <p id="page-sub">集中查看系统运行、播放使用和待处理事项</p>
      </div>
      <div class="top-actions">
        <span class="ver" id="version">—</span>
        <button class="btn" onclick="renderPage(state.page, true)">刷新</button>
      </div>
    </header>
    <div id="meta-line"><span id="last-updated">最近更新: —</span><span class="tag idle" id="live-state">连接中</span></div>
    <main id="view"></main>
  </div>
</div>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/intake.js"></script>
<script src="/static/nodepool.js"></script>
<script src="/static/ops.js"></script>
<script src="/static/members.js"></script>
</body>
</html>
